app = "workwink-live"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4173"
  LOG_LEVEL = "info"
  APIFY_ACTOR_ID = "apify/web-scraper"
  APIFY_SCHEDULE_ID = "IctqdM98NGHqgvCiE"
  ELASTICSEARCH_INDEX_PREFIX = "workwink"
  ELASTIC_SEARCH_MODE = "lexical"
  ELASTIC_NVIDIA_INFERENCE_ID = "workwink-nemotron"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "25s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
